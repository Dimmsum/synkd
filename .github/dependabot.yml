version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Batch minor/patch bumps into one PR; majors arrive one by one so they can be checked.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned on purpose: typescript-eslint doesn't support TS 7 yet, and Vitest 5 needs Node 22.12+.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: '@vitest/*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
